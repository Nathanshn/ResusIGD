# XcodeGen spec — generate the Xcode project on a Mac with:  xcodegen generate
name: ResusIGD
options:
  bundleIdPrefix: id.resusigd
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: id
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  ClinicalCore:
    path: ClinicalCore
targets:
  ResusIGD:
    type: application
    platform: iOS
    sources:
      - path: ResusIGD
    dependencies:
      - package: ClinicalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.resusigd.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ResusIGD
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  ResusIGDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ResusIGDTests
    dependencies:
      - target: ResusIGD
      - package: ClinicalCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: id.resusigd.app.tests
schemes:
  ResusIGD:
    build:
      targets:
        ResusIGD: all
    test:
      targets:
        - ResusIGDTests
